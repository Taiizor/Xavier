name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 1.0.0)"
                required: true
                type: string

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_NOLOGO: true

permissions:
    contents: write

jobs:
    release:
        name: Build, Test & Publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Determine version
              id: version
              run: |
                  if [ "${{ github.event_name }}" == "push" ]; then
                    VERSION="${GITHUB_REF#refs/tags/v}"
                  else
                    VERSION="${{ github.event.inputs.version }}"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

            - name: Test
              run: dotnet test --no-build -c Release --verbosity normal

            - name: Pack
              run: dotnet pack src/Xavier/Xavier.csproj -c Release -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

            - name: Publish to NuGet
              run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

            - name: Upload packages to GitHub Release
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ./artifacts/*.nupkg
                      ./artifacts/*.snupkg
                  generate_release_notes: true
                  body: |
                      ## Xavier v${{ steps.version.outputs.version }}

                      **Opinionated but customizable API defaults pack for ASP.NET Core.**

                      Xavier bundles common cross-cutting concerns into a simple, one-liner setup — no boilerplate required.

                      ### Installation

                      ```bash
                      dotnet add package Xavier --version ${{ steps.version.outputs.version }}
                      ```

                      ### Features

                      - ✅ **ProblemDetails** - RFC 7807 error responses with trace/correlation IDs
                      - ✅ **Correlation ID** - Request tracking with `X-Correlation-Id` header
                      - ✅ **Health Endpoints** - `/health` (liveness) and `/ready` (readiness)
                      - ✅ **OpenAPI** - Document exposure at `/openapi/v1.json` (net8+)
                      - ✅ **HTTP Logging** - Safe-by-default request/response logging
                      - ✅ **Rate Limiting** - Global, Per-IP, Per-Client policies (net7+)
                      - ✅ **Resilience** - HttpClient retry/timeout/circuit-breaker (net8+)
                      - ✅ **Observability** - OpenTelemetry wiring (no forced exporters)

                      ### Supported Frameworks

                      `net6.0` | `net7.0` | `net8.0` | `net9.0` | `net10.0`

                      ### Links

                      - 📦 [NuGet Package](https://www.nuget.org/packages/Xavier/${{ steps.version.outputs.version }})
                      - 📖 [Documentation](https://github.com/Taiizor/Xavier#readme)
